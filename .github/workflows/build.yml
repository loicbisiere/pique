# Builds Toothpeek.app on every push and pull request.
# On a version tag (v1.2.3): publishes a GitHub Release with Toothpeek-1.2.3.zip and updates the Homebrew tap.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Read-only by default; only the release job, which runs on version tags, can write.
permissions:
  contents: read

# Actions are pinned to commit SHAs (a moved tag cannot change what runs); Dependabot proposes updates.

jobs:
  build:
    runs-on: macos-26
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.zip.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Toothpeek.app (universal, ad hoc signed)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./bundle.sh

      - name: Zip
        id: zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ditto -c -k --keepParent build/Toothpeek.app "build/Toothpeek-$VERSION.zip"
          echo "sha256=$(shasum -a 256 "build/Toothpeek-$VERSION.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Toothpeek-${{ steps.version.outputs.version }}
          path: build/Toothpeek-${{ steps.version.outputs.version }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    env:
      VERSION: ${{ needs.build.outputs.version }}
      SHA256: ${{ needs.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Toothpeek-${{ needs.build.outputs.version }}

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Toothpeek-$VERSION.zip" --title "Toothpeek $VERSION" --generate-notes

      # Needs a fine-grained token with "Contents: read and write" on loicbisiere/homebrew-tap,
      # saved as the HOMEBREW_TAP_TOKEN secret of this repository. Skipped when the secret is missing.
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set, skipping the tap update."
            exit 0
          fi
          git clone "https://x-access-token:$TAP_TOKEN@github.com/loicbisiere/homebrew-tap.git" tap
          mkdir -p tap/Casks
          # Drop the template's own "# " comment lines, fill in the placeholders.
          sed -e '/^# /d' -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$SHA256/" packaging/homebrew/toothpeek.rb > tap/Casks/toothpeek.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/toothpeek.rb
          git commit -m "toothpeek $VERSION"
          git push
