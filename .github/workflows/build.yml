# Builds Pique.app on every push and pull request.
# On a version tag (v1.2.3): publishes a GitHub Release with Pique-1.2.3.zip and updates the Homebrew tap.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # create the GitHub Release on tags

# Actions are pinned to commit SHAs (a moved tag cannot change what runs); Dependabot proposes updates.

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      - name: Build Pique.app (universal, ad hoc signed)
        run: BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./bundle.sh

      - name: Zip
        run: |
          ditto -c -k --keepParent build/Pique.app "build/Pique-$VERSION.zip"
          echo "SHA256=$(shasum -a 256 "build/Pique-$VERSION.zip" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Pique-${{ env.VERSION }}
          path: build/Pique-${{ env.VERSION }}.zip

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "build/Pique-$VERSION.zip" --title "Pique $VERSION" --generate-notes

      # Needs a fine-grained token with "Contents: read and write" on loicbisiere/homebrew-tap,
      # saved as the HOMEBREW_TAP_TOKEN secret of this repository. Skipped when the secret is missing.
      - name: Update Homebrew tap
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set, skipping the tap update."
            exit 0
          fi
          git clone "https://x-access-token:$TAP_TOKEN@github.com/loicbisiere/homebrew-tap.git" tap
          mkdir -p tap/Casks
          # Drop the template's own "# " comment lines, fill in the placeholders.
          sed -e '/^# /d' -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$SHA256/" packaging/homebrew/pique.rb > tap/Casks/pique.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/pique.rb
          git commit -m "pique $VERSION"
          git push
